name: Build macOS applications
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          version: '6.8.3'
          cache: true
      - name: Build, test, and package both architectures
        run: ./build.sh --qt "$QT_ROOT_DIR" --cmake "$(command -v cmake)" --arch universal
      - name: Upload applications and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ControlPanel-macos-universal
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
